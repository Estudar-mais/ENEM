<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#dce4f7"/>
  
  <!-- Left page (Simulado) -->
  <rect x="80" y="80" width="280" height="420" fill="#ffffff" stroke="#bfcff7" stroke-width="2" rx="4"/>
  
  <!-- Header -->
  <rect x="95" y="95" width="250" height="35" fill="#2c3e50"/>
  <text x="220" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SIMULADO ENEM</text>
  
  <!-- Subtitle -->
  <text x="220" y="150" font-family="Arial" font-size="11" font-weight="600" fill="#2c3e50" text-anchor="middle">Exam Nacional do Ensino Médio</text>
  <line x1="100" y1="160" x2="340" y2="160" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Content -->
  <text x="100" y="185" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">PROVA DE CIÊNCIAS HUMANAS</text>
  
  <text x="100" y="210" font-family="Arial" font-size="9" fill="#2c3e50">QUESTÃO 1</text>
  <text x="100" y="230" font-family="Arial" font-size="8" fill="#4a3d44">O período da Revolução Industrial</text>
  <text x="100" y="245" font-family="Arial" font-size="8" fill="#4a3d44">(A) Expansão do feudalismo...</text>
  <text x="100" y="258" font-family="Arial" font-size="8" fill="#4a3d44">(B) Crescimento das cidades...</text>
  <text x="100" y="271" font-family="Arial" font-size="8" fill="#4a3d44">(C) Ascensão da burguesia...</text>
  <text x="100" y="284" font-family="Arial" font-size="8" fill="#4a3d44">(D) Fortalecimento da monarquia...</text>
  
  <text x="100" y="310" font-family="Arial" font-size="9" fill="#2c3e50">QUESTÃO 2</text>
  <text x="100" y="330" font-family="Arial" font-size="8" fill="#4a3d44">A Guerra Fria foi caracterizada...</text>
  <text x="100" y="343" font-family="Arial" font-size="8" fill="#4a3d44">(A) Aliança entre EUA e URSS...</text>
  <text x="100" y="356" font-family="Arial" font-size="8" fill="#4a3d44">(B) Conflitos armados diretos...</text>
  <text x="100" y="369" font-family="Arial" font-size="8" fill="#4a3d44">(C) Corrida armamentista...</text>
  <text x="100" y="382" font-family="Arial" font-size="8" fill="#4a3d44">(D) Descolonização da África...</text>
  
  <!-- Right page (Answer sheet) -->
  <rect x="440" y="80" width="280" height="420" fill="#ffffff" stroke="#bfcff7" stroke-width="2" rx="4"/>
  
  <!-- Header -->
  <text x="580" y="110" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">CARTÃO-RESPOSTA</text>
  <text x="580" y="135" font-family="Arial" font-size="9" fill="#4a3d44" text-anchor="middle">Número de Inscrição: ________________</text>
  <text x="580" y="155" font-family="Arial" font-size="9" fill="#4a3d44" text-anchor="middle">Nome do Candidato: ________________</text>
  
  <!-- Answer circles -->
  <g>
    <text x="460" y="185" font-family="Arial" font-size="9" font-weight="bold" fill="#2c3e50">Q1</text>
    <circle cx="490" cy="180" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <text x="500" y="185" font-family="Arial" font-size="9" fill="#2c3e50">A</text>
    <circle cx="520" cy="180" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="545" cy="180" r="8" fill="#d34017"/>
    <text x="555" y="185" font-family="Arial" font-size="9" fill="#2c3e50">C</text>
    <circle cx="575" cy="180" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="600" cy="180" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <text x="610" y="185" font-family="Arial" font-size="9" fill="#2c3e50">E</text>
  </g>
  
  <!-- More questions -->
  <g>
    <text x="460" y="225" font-family="Arial" font-size="9" font-weight="bold" fill="#2c3e50">Q2</text>
    <circle cx="490" cy="220" r="8" fill="#d34017"/>
    <text x="500" y="225" font-family="Arial" font-size="9" fill="#2c3e50">B</text>
    <circle cx="520" cy="220" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="545" cy="220" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <text x="555" y="225" font-family="Arial" font-size="9" fill="#2c3e50">D</text>
    <circle cx="575" cy="220" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
  </g>
  
  <g>
    <text x="460" y="265" font-family="Arial" font-size="9" font-weight="bold" fill="#2c3e50">Q3</text>
    <circle cx="490" cy="260" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="515" cy="260" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="540" cy="260" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="565" cy="260" r="8" fill="#d34017"/>
  </g>
  
  <g>
    <text x="460" y="305" font-family="Arial" font-size="9" font-weight="bold" fill="#2c3e50">Q4</text>
    <circle cx="490" cy="300" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="515" cy="300" r="8" fill="#d34017"/>
    <circle cx="540" cy="300" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="565" cy="300" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
  </g>
  
  <g>
    <text x="460" y="345" font-family="Arial" font-size="9" font-weight="bold" fill="#2c3e50">Q5</text>
    <circle cx="490" cy="340" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="515" cy="340" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="540" cy="340" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="565" cy="340" r="8" fill="none" stroke="#bfcff7" stroke-width="1"/>
    <circle cx="590" cy="340" r="8" fill="#d34017"/>
  </g>
  
  <!-- Label -->
  <text x="490" y="385" font-family="Arial" font-size="9" font-weight="600" fill="#4a3d44">Gabarito Incluído</text>
  <text x="660" y="385" font-family="Arial" font-size="9" fill="#d34017">+ resolução</text>
</svg>